name: Set up supported tmux
description: Build the pinned tmux 3.7c baseline for isolated Linux CI tests
inputs:
  test-node-version:
    description: Node version to restore after building native prerequisites
    default: "22"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - shell: bash
      run: sudo apt-get update && sudo apt-get install -y build-essential autoconf automake pkg-config libevent-dev libncurses-dev ncurses-base ncurses-term libutf8proc-dev bison patchelf
    - shell: bash
      run: |
        repository="$(node -p 'require("./native/tmux/provenance.json").repository')"
        commit="$(node -p 'require("./native/tmux/provenance.json").commit')"
        git init --quiet "$RUNNER_TEMP/tmux-supported-source"
        git -C "$RUNNER_TEMP/tmux-supported-source" remote add origin "$repository"
        git -C "$RUNNER_TEMP/tmux-supported-source" fetch --depth=1 origin "$commit"
        git -C "$RUNNER_TEMP/tmux-supported-source" checkout --detach FETCH_HEAD
        node scripts/build-bundled-tmux.mjs --source "$RUNNER_TEMP/tmux-supported-source" --output "$RUNNER_TEMP/tmux-supported" --jobs 2
        "$RUNNER_TEMP/tmux-supported/tmux" -V
        echo "$RUNNER_TEMP/tmux-supported" >> "$GITHUB_PATH"
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.test-node-version }}
